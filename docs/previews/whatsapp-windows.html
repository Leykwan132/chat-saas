<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp countdown preview</title>
  </head>
  <body class="bg-background text-foreground">
    <main class="mx-auto flex min-h-screen max-w-2xl flex-col justify-center gap-5 p-6">
      <div>
        <h1 class="text-xl font-semibold">WhatsApp countdown preview</h1>
        <p class="mt-1 text-sm text-muted-foreground">Sample messaging windows above the reply input.</p>
      </div>
      <section class="overflow-hidden rounded-xl border border-border bg-card shadow-sm">
        <header class="border-b border-border px-4 py-3 text-sm font-medium">Customer conversation</header>
        <div class="flex min-h-56 items-end bg-muted/20 p-4">
          <div class="max-w-xs rounded-xl bg-muted px-4 py-3 text-sm">Hi, I saw your ad. Can you tell me more?</div>
        </div>
        <div id="windows"></div>
        <div class="border-t border-border bg-background p-3">
          <div class="rounded-xl border border-input px-3 py-3">
            <textarea aria-label="Sample reply" class="min-h-16 w-full resize-none bg-transparent text-sm outline-none" placeholder="Type your reply…" disabled></textarea>
            <div class="text-right text-xs text-muted-foreground">Preview · sending disabled</div>
          </div>
        </div>
      </section>
    </main>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { BrowserRouter } from 'react-router';
      import { TooltipProvider } from '/src/components/ui/tooltip.tsx';
      import { ConversationWindowBanner } from '/src/components/inbox/ConversationWindowBanner.tsx';
      import '/src/index.css';

      createRoot(document.getElementById('windows')).render(
        React.createElement(BrowserRouter, null,
          React.createElement(TooltipProvider, null,
            React.createElement(ConversationWindowBanner, {
              service: 'whatsapp',
              lastCustomerMessageAt: undefined,
              agentId: undefined,
            }),
          ),
        ),
      );
    </script>
  </body>
</html>
