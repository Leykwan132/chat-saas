name: Repair push dependency lockfile
on:
  push:
    branches: [codex/pwa-notifications-and-resume]
    paths: [.github/workflows/repair-push-lockfile.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Generate lockfile
        run: bun install --lockfile-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git diff --cached --quiet || git commit -m "Synchronize Web Push dependency lockfile"
          git push
      - name: Verify frozen dependency installation
        run: bun install --frozen-lockfile
      - name: Verify production build
        run: npm run build
      - name: Verify Convex push action bundling
        run: bunx --no-install esbuild convex/pushNotifications/send.ts --bundle --platform=node --outfile=/tmp/kilobot-push-action.js
      - name: Verify notification tests
        run: bunx --no-install vitest run convex/pushNotifications src/pwa src/components/notifications src/components/AgentSidebarNavigation.test.tsx src/pages/pageHeaderChrome.test.ts
